[project]
name = "marg-next-erp-api"
version = "0.1.0"
description = "Production-grade ERP API foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.13.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "redis>=5.0.0",
  "celery>=5.4.0",
  "structlog>=24.2.0",
  "pytest>=8.2.0",
]

[tool.ruff]
line-length = 100
