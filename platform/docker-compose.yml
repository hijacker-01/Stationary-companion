version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    depends_on:
      - redis
      - postgres
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO -Q ocr,forecast,anomaly,recommendation

  nginx:
    image: nginx:1.27
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
